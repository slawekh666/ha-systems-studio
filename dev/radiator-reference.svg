<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200">
      <defs>
        <linearGradient id="tubeGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#bcc4ce"/>
          <stop offset=".10" stop-color="#f9fbfd"/>
          <stop offset=".32" stop-color="#d5dde6"/>
          <stop offset=".52" stop-color="#f6f7f9"/>
          <stop offset=".76" stop-color="#bcc5d1"/>
          <stop offset="1" stop-color="#eef2f6"/>
        </linearGradient>
        <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#697481"/>
          <stop offset=".16" stop-color="#e3e8ee"/>
          <stop offset=".46" stop-color="#66717f"/>
          <stop offset=".76" stop-color="#1f2833"/>
          <stop offset="1" stop-color="#9ca6b1"/>
        </linearGradient>
        <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#08131f"/>
          <stop offset="1" stop-color="#02070d"/>
        </linearGradient>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#21d1ff"/>
          <stop offset="1" stop-color="#87f0ff"/>
        </linearGradient>
        <linearGradient id="redKnobGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#5a0006"/>
          <stop offset=".18" stop-color="#ff6161"/>
          <stop offset=".55" stop-color="#d9141e"/>
          <stop offset="1" stop-color="#7d0006"/>
        </linearGradient>
        <linearGradient id="blueKnobGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#03265f"/>
          <stop offset=".18" stop-color="#7edaff"/>
          <stop offset=".55" stop-color="#1374ff"/>
          <stop offset="1" stop-color="#092f83"/>
        </linearGradient>
        <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
      </defs>

      <g id="auraGroup"></g>

      <g id="radiatorGroup">
        <g id="hiddenHeaders" opacity=".95">
          <rect x="220" y="290" width="900" height="52" rx="24" fill="url(#headerGrad)"/>
          <rect x="220" y="748" width="900" height="52" rx="24" fill="url(#headerGrad)"/>
        </g>
        <g id="tubesGroup">
          <rect x="200" y="184" width="102" height="714" rx="50" fill="url(#tubeGrad)" stroke="#ffffff" stroke-opacity=".55" stroke-width="3"/>
          <rect x="334" y="184" width="102" height="714" rx="50" fill="url(#tubeGrad)" stroke="#ffffff" stroke-opacity=".55" stroke-width="3"/>
          <rect x="468" y="184" width="102" height="714" rx="50" fill="url(#tubeGrad)" stroke="#ffffff" stroke-opacity=".55" stroke-width="3"/>
          <rect x="602" y="184" width="102" height="714" rx="50" fill="url(#tubeGrad)" stroke="#ffffff" stroke-opacity=".55" stroke-width="3"/>
          <rect x="736" y="184" width="102" height="714" rx="50" fill="url(#tubeGrad)" stroke="#ffffff" stroke-opacity=".55" stroke-width="3"/>
          <rect x="870" y="184" width="102" height="714" rx="50" fill="url(#tubeGrad)" stroke="#ffffff" stroke-opacity=".55" stroke-width="3"/>
          <rect x="1004" y="184" width="102" height="714" rx="50" fill="url(#tubeGrad)" stroke="#ffffff" stroke-opacity=".55" stroke-width="3"/>
        </g>
      </g>

      <g id="connectorsGroup">
        <g id="topValveGroup">
          <rect x="1100" y="272" width="44" height="88" rx="18" fill="url(#headerGrad)"/>
          <polygon points="1140,280 1180,280 1192,316 1180,352 1140,352 1128,316" fill="url(#headerGrad)" stroke="#dfe7ef" stroke-opacity=".45" stroke-width="2"/>
          <rect x="1188" y="286" width="36" height="60" rx="12" fill="url(#headerGrad)"/>
          <rect x="1220" y="260" width="86" height="112" rx="24" fill="url(#redKnobGrad)" stroke="#ffb0b0" stroke-opacity=".35" stroke-width="2"/>
          <g opacity=".45">
            <path d="M1232 266 V366" stroke="#ffedf1" stroke-width="2"/>
            <path d="M1244 262 V370" stroke="#5a0006" stroke-width="2"/>
            <path d="M1256 262 V370" stroke="#5a0006" stroke-width="2"/>
            <path d="M1268 262 V370" stroke="#5a0006" stroke-width="2"/>
            <path d="M1280 262 V370" stroke="#5a0006" stroke-width="2"/>
            <path d="M1292 266 V366" stroke="#ffedf1" stroke-width="2"/>
          </g>
        </g>
        <g id="bottomValveGroup">
          <rect x="1100" y="668" width="44" height="88" rx="18" fill="url(#headerGrad)"/>
          <polygon points="1140,676 1180,676 1192,712 1180,748 1140,748 1128,712" fill="url(#headerGrad)" stroke="#dfe7ef" stroke-opacity=".45" stroke-width="2"/>
          <rect x="1188" y="682" width="36" height="60" rx="12" fill="url(#headerGrad)"/>
          <rect x="1220" y="656" width="86" height="112" rx="24" fill="url(#blueKnobGrad)" stroke="#bce8ff" stroke-opacity=".35" stroke-width="2"/>
          <g opacity=".42">
            <path d="M1232 662 V762" stroke="#e4f7ff" stroke-width="2"/>
            <path d="M1244 658 V766" stroke="#0e2e72" stroke-width="2"/>
            <path d="M1256 658 V766" stroke="#0e2e72" stroke-width="2"/>
            <path d="M1268 658 V766" stroke="#0e2e72" stroke-width="2"/>
            <path d="M1280 658 V766" stroke="#0e2e72" stroke-width="2"/>
            <path d="M1292 662 V762" stroke="#e4f7ff" stroke-width="2"/>
          </g>
        </g>
      </g>

      <g id="displayMountGroup">
        <path d="M1096 314 H1038 Q1018 314 1018 334 V366" fill="none" stroke="#394657" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g id="displayGroup">
        <rect x="820" y="278" width="280" height="154" rx="24" fill="#cad5df" stroke="#f2f7fb" stroke-width="3"/>
        <rect x="834" y="292" width="252" height="126" rx="18" fill="url(#screenGrad)" stroke="#39b9ff" stroke-opacity=".45" stroke-width="2"/>
        <text x="854" y="314" font-size="12" font-family="monospace" fill="#76ddff">VALVE CONTROL</text>
        <text x="1018" y="314" font-size="12" font-family="monospace" fill="#76ddff">OPEN</text>

        <g id="barsGroup" transform="translate(856 348)">
          <rect id="bar1" x="0" y="42" width="28" height="10" rx="5" fill="#28c0ff"/>
          <rect id="bar2" x="0" y="27" width="40" height="10" rx="5" fill="#3de060"/>
          <rect id="bar3" x="0" y="12" width="52" height="10" rx="5" fill="#ffb12a"/>
          <rect id="bar4" x="0" y="-3" width="64" height="10" rx="5" fill="#ff5136"/>
        </g>

        <circle cx="980" cy="360" r="44" fill="none" stroke="#173041" stroke-width="11"/>
        <circle id="valveRing" cx="980" cy="360" r="44" fill="none" stroke="url(#ringGrad)" stroke-width="11" stroke-linecap="round" transform="rotate(-130 980 360)" stroke-dasharray="0 276"/>
        <text id="tempText" x="980" y="354" text-anchor="middle" font-size="28" font-family="monospace" font-weight="700" fill="#edf8ff">55°</text>
        <text id="openText" x="980" y="378" text-anchor="middle" font-size="17" font-family="monospace" font-weight="700" fill="#7ae8ff">42%</text>
        <text x="980" y="394" text-anchor="middle" font-size="10" font-family="monospace" fill="#7ecfff">VALVE</text>

        <text x="1040" y="336" font-size="11" font-family="monospace" fill="#78dcff">TEMP</text>
        <text id="tempLarge" x="1040" y="364" font-size="28" font-family="monospace" font-weight="700" fill="#f0f8ff">55°C</text>
        <text x="1040" y="388" font-size="11" font-family="monospace" fill="#78dcff">OPEN LEVEL</text>
        <text id="openLarge" x="1040" y="412" font-size="24" font-family="monospace" font-weight="700" fill="#8beaff">42%</text>
      </g>
    </svg>