stages:
  - test

validate_card:
  stage: test
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache nodejs git
  script:
    - python3 scripts/build.py
    - python3 scripts/check.py
    - python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
    - node scripts/test_studio.js
    - node dev/test-refactor-baseline.js
    - node dev/test-config-migrations.js
    - node dev/test-power-grid.js
    - node dev/test-scaled-icons.js
    - node dev/test-energy-storage.js
    - node dev/test-inverter.js
    - node dev/test-inverter-svg-binding.js
    - node dev/test-inverter-readings.js
    - node dev/test-pv-source-priority.js
    - node dev/test-pv-dc-port-bindings.js
    - node dev/test-dc-diagnostic-clarity.js
    - node dev/test-device-parameters.js
    - node dev/test-inverter-inspector.js
    - node dev/test-ev-charger.js
    - node dev/test-buildings-power.js
    - node dev/test-energy-balance.js
    - node dev/test-energy-flow.js
    - node dev/test-energy-diagnostics.js
    - node dev/test-energy-unified.js
    - node dev/test-building-power-contract.js
    - node dev/test-building-topology.js
    - node dev/test-auto-meter-hierarchy.js
    - node dev/test-single-graph-balance.js
    - node dev/test-topology-indexes.js
    - node dev/test-building-inspector-simplify.js
    - node dev/test-energy-07a.js
    - node dev/test-power-only.js
    - node dev/test-electric-ports.js
    - node dev/test-device-properties.js
    - node dev/test-connections.js
    - node dev/test-wire-colors.js
    - node dev/test-pellet-level.js
    - git diff --exit-code -- dist/ha-systems-studio.js
