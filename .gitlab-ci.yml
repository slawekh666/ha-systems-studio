stages:
  - test

validate_card:
  stage: test
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache nodejs git
  script:
    - python3 scripts/build.py
    - python3 scripts/check.py
    - node scripts/test_studio.js
    - node dev/test-power-grid.js
    - node dev/test-scaled-icons.js
    - python3 -c 'import base64,pathlib; print("BUNDLE_BEGIN" + base64.b64encode(pathlib.Path("dist/ha-systems-studio.js").read_bytes()).decode() + "BUNDLE_END")'
    - git diff --exit-code -- dist/ha-systems-studio.js
