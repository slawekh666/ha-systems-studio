<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1350">
<defs>
        <linearGradient id="bodyFront" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#344864"/>
          <stop offset=".14" stop-color="#60759a"/>
          <stop offset=".50" stop-color="#101926"/>
          <stop offset=".86" stop-color="#4f668a"/>
          <stop offset="1" stop-color="#2b3d57"/>
        </linearGradient>
        <linearGradient id="bodyPanel" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#364960"/>
          <stop offset="1" stop-color="#121b27"/>
        </linearGradient>
        <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0f1723"/>
          <stop offset="1" stop-color="#05090f"/>
        </linearGradient>
        <linearGradient id="sideBevel" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#152338"/>
          <stop offset=".5" stop-color="#4f6790"/>
          <stop offset="1" stop-color="#19283e"/>
        </linearGradient>
        <linearGradient id="screenGlass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0d223a"/>
          <stop offset="1" stop-color="#030811"/>
        </linearGradient>
        <linearGradient id="screenHighlight" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#d5eeff" stop-opacity=".15"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="doorGlass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#202834"/>
          <stop offset=".55" stop-color="#0f1620"/>
          <stop offset="1" stop-color="#070c13"/>
        </linearGradient>
        <linearGradient id="doorInnerFrame" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#202a39"/>
          <stop offset=".5" stop-color="#556882"/>
          <stop offset="1" stop-color="#1b2531"/>
        </linearGradient>
        <linearGradient id="grateGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2a313b"/>
          <stop offset="1" stop-color="#11161d"/>
        </linearGradient>
        <linearGradient id="displayAccent" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#74c7ff"/>
          <stop offset="1" stop-color="#35f0db"/>
        </linearGradient>
        <filter id="blueGlow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="10"/></filter>
        <filter id="softBlueGlow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="6"/></filter>
      <clipPath id="solidFireClip"><rect x="420" y="586" width="180" height="210" rx="12"/></clipPath></defs>

      <g id="outerAura"><path d="M270 210 L754 210 L792 248 L792 1146 L754 1180 L270 1180 L232 1146 L232 248 Z" fill="none" stroke="#1a95ff" stroke-opacity=".26" stroke-width="16" filter="url(#blueGlow)"/></g>

      <g id="chimney">
        <rect x="446" y="84" width="132" height="140" rx="16" fill="url(#bodyFront)" stroke="#90d1ff" stroke-opacity=".95" stroke-width="4"/>
        <rect x="438" y="216" width="148" height="18" rx="3" fill="#dcecff" opacity=".80"/>
      </g>

      <g id="stoveBody">
        <path d="M270 210 L754 210 L792 248 L792 1146 L754 1180 L270 1180 L232 1146 L232 248 Z" fill="url(#bodyFront)" stroke="#dcecff" stroke-opacity=".86" stroke-width="4"/>
        <path d="M232 248 L270 210 V1180 L232 1146 Z" fill="url(#sideBevel)" opacity=".70"/>
        <path d="M754 210 L792 248 V1146 L754 1180 Z" fill="url(#sideBevel)" opacity=".50"/>
        <rect x="262" y="220" width="500" height="15" rx="2" fill="#f1f6ff" opacity=".86"/>
        <line x1="364" y1="220" x2="364" y2="646" stroke="#0a111a" stroke-opacity=".50" stroke-width="3"/>
        <line x1="660" y1="220" x2="660" y2="646" stroke="#0a111a" stroke-opacity=".50" stroke-width="3"/>
        <line x1="262" y1="646" x2="762" y2="646" stroke="#d8e8ff" stroke-opacity=".24" stroke-width="3"/>
      </g>

      <g id="displayGroup">
        <rect x="416" y="294" width="266" height="150" rx="16" fill="#070f18" stroke="#8fd1ff" stroke-width="3"/>
        <rect x="424" y="302" width="250" height="134" rx="14" fill="url(#screenGlass)"/>
        <path d="M430 308 H560 L525 430 H430 Z" fill="url(#screenHighlight)"/>
        <text x="446" y="340" font-size="18" fill="#89cfff" font-family="monospace">TEMP</text>
        <text id="tempValue" x="446" y="396" font-size="56" font-weight="700" fill="#e0f8ff" font-family="monospace">65.0°</text>
        <text x="560" y="394" font-size="20" fill="#7bd1ff" font-family="monospace">C</text>
        <text id="fuelLabel" x="446" y="424" font-size="18" fill="#58bcff" font-family="monospace">DREWNO</text>
        <circle cx="596" cy="370" r="38" fill="#08111a" stroke="#9ed9ff" stroke-width="5"/>
        <path d="M596 332 A 38 38 0 1 1 595.9 332" fill="none" stroke="#233043" stroke-width="11" stroke-linecap="round"/>
        <path id="dialArc" d="M596 332 A 38 38 0 1 1 595.9 332" fill="none" stroke="#59c84c" stroke-width="11" stroke-linecap="round" stroke-dasharray="120 240"/>
        <circle cx="596" cy="370" r="11" fill="#08111a"/>
        <circle cx="702" cy="332" r="14" fill="#07111a" stroke="#7fc6ff" stroke-width="3"/>
        <circle cx="702" cy="370" r="14" fill="#07111a" stroke="#7fc6ff" stroke-width="3"/>
        <circle cx="702" cy="408" r="14" fill="#07111a" stroke="#7fc6ff" stroke-width="3"/>
        <circle cx="702" cy="332" r="4" fill="#7fc6ff"/>
        <path d="M696 371 h12 M702 365 v12" stroke="#7fc6ff" stroke-width="2" stroke-linecap="round"/>
        <rect x="696" y="402" width="12" height="12" rx="2" fill="none" stroke="#7fc6ff" stroke-width="2"/>
      </g>

      <g id="fireSection">
        <rect x="322" y="500" width="380" height="470" rx="18" fill="#0a1119" opacity=".52"/>
        <rect x="296" y="468" width="432" height="500" rx="6" fill="#081019" opacity=".26"/>
        <rect x="350" y="520" width="320" height="420" rx="16" fill="url(#bodyPanel)" stroke="#9bb1d3" stroke-opacity=".58" stroke-width="2.2"/>
        <rect x="390" y="556" width="240" height="338" rx="22" fill="url(#doorGlass)" stroke="#8fcfff" stroke-width="3.2"/>
        <rect id="doorGlowFrame" x="390" y="556" width="240" height="338" rx="22" fill="none" stroke="#23a4ff" stroke-opacity=".22" stroke-width="10" filter="url(#softBlueGlow)"/>
        <path d="M408 582 h56 v224 l-42 0 z" fill="#ffffff" opacity=".11"/>
        <path d="M612 570 h-48 l-34 320 h34 z" fill="#9dd5ff" opacity=".05"/>

        <!-- empty combustion chamber -->
        <g id="emptyChamber">
          <rect x="408" y="575" width="204" height="300" rx="18" fill="#0d131b" stroke="url(#doorInnerFrame)" stroke-width="2"/>
          <rect x="420" y="586" width="180" height="210" rx="12" fill="#0a0f16"/>
          <rect x="420" y="586" width="180" height="210" rx="12" fill="none" stroke="#8ecfff" stroke-opacity=".08" stroke-width="2"/>
          <g opacity=".12" stroke="#dbeaff" stroke-width="1.5">
            <line x1="452" y1="590" x2="452" y2="792"/>
            <line x1="512" y1="590" x2="512" y2="792"/>
            <line x1="572" y1="590" x2="572" y2="792"/>
          </g>
          <g id="grate">
            <rect x="432" y="804" width="156" height="14" rx="4" fill="url(#grateGrad)"/>
            <g fill="url(#grateGrad)">
              <rect x="438" y="784" width="8" height="30" rx="2"/>
              <rect x="458" y="784" width="8" height="30" rx="2"/>
              <rect x="478" y="784" width="8" height="30" rx="2"/>
              <rect x="498" y="784" width="8" height="30" rx="2"/>
              <rect x="518" y="784" width="8" height="30" rx="2"/>
              <rect x="538" y="784" width="8" height="30" rx="2"/>
              <rect x="558" y="784" width="8" height="30" rx="2"/>
              <rect x="578" y="784" width="8" height="30" rx="2"/>
            </g>
          </g>
          <path d="M430 835 C468 825 554 825 590 835" fill="none" stroke="#9ccfff" stroke-opacity=".07" stroke-width="10" stroke-linecap="round"/>
        </g>

        <g id="combustionSlot"></g>
        <g id="hinges" fill="url(#bodyFront)" stroke="#8fcfff" stroke-width="2.2">
          <rect x="372" y="606" width="16" height="98" rx="4"/>
          <rect x="372" y="804" width="16" height="98" rx="4"/>
        </g>
        <g id="handle">
          <rect x="650" y="756" width="32" height="104" rx="10" fill="url(#bodyFront)" stroke="#91d0ff" stroke-width="2.5"/>
          <rect x="642" y="746" width="14" height="44" rx="6" fill="#7ec9ff" opacity=".72"/>
        </g>
      </g>

      <g id="drawer">
        <rect x="366" y="1010" width="292" height="130" rx="10" fill="url(#bodyPanel)" stroke="#a4b7d7" stroke-opacity=".60" stroke-width="2.2"/>
        <rect x="472" y="1064" width="80" height="26" rx="4" fill="#0b1118" stroke="#91cfff" stroke-width="2"/>
      </g>

      <g id="base">
        <path d="M238 1162 H786 L788 1236 L754 1266 H270 L236 1236 Z" fill="url(#bodyFront)" stroke="#8fd2ff" stroke-opacity=".88" stroke-width="4"/>
        <path d="M236 1236 L270 1266 V1162 H238 Z" fill="#40699f" opacity=".62"/>
        <path d="M786 1162 L788 1236 L754 1266 V1162 Z" fill="#2f4a72" opacity=".58"/>
        <ellipse cx="284" cy="1298" rx="28" ry="14" fill="url(#bodyFront)"/>
        <rect x="256" y="1248" width="56" height="54" rx="8" fill="url(#bodyFront)"/>
        <ellipse cx="740" cy="1298" rx="28" ry="14" fill="url(#bodyFront)"/>
        <rect x="712" y="1248" width="56" height="54" rx="8" fill="url(#bodyFront)"/>
      </g>
</svg>
