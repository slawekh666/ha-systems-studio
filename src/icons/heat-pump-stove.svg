<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 1000">
<defs>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#dde5ef"/>
          <stop offset=".14" stop-color="#fbfdff"/>
          <stop offset=".48" stop-color="#c2ccda"/>
          <stop offset=".78" stop-color="#a7b3c4"/>
          <stop offset="1" stop-color="#8f9cae"/>
        </linearGradient>
        <linearGradient id="bodySideGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#eef4fb"/>
          <stop offset="1" stop-color="#b5c1d1"/>
        </linearGradient>
        <linearGradient id="darkPanel" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0e1c2e"/>
          <stop offset="1" stop-color="#02070f"/>
        </linearGradient>
        <linearGradient id="blueFanGlow" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#23a8ff"/>
          <stop offset="1" stop-color="#0069ff"/>
        </linearGradient>
        <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#143962"/>
          <stop offset=".5" stop-color="#07101b"/>
          <stop offset="1" stop-color="#0f2c4d"/>
        </linearGradient>
        <linearGradient id="footGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#1d2837"/>
          <stop offset=".5" stop-color="#5c6f8a"/>
          <stop offset="1" stop-color="#1b2635"/>
        </linearGradient>
        <radialGradient id="fanAura" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#1b86ff" stop-opacity=".25"/>
          <stop offset=".55" stop-color="#0f6df5" stop-opacity=".16"/>
          <stop offset="1" stop-color="#0f6df5" stop-opacity="0"/>
        </radialGradient>
        <filter id="blueGlow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="10"/></filter>
        <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="5"/></filter>
      </defs>

      <g id="aura">
        <path id="hpAuraOutline" d="M126 152 H1128 Q1168 152 1168 192 V790 Q1168 828 1128 828 H126 Q86 828 86 790 V192 Q86 152 126 152 Z" fill="none" stroke="#2aa5ff" stroke-opacity="0.12" stroke-width="16" filter="url(#blueGlow)"/>
      </g>

      <g id="unitBody">
        <path d="M126 152 H1128 Q1168 152 1168 192 V790 Q1168 828 1128 828 H126 Q86 828 86 790 V192 Q86 152 126 152 Z" fill="url(#bodyGrad)" stroke="#f8fbff" stroke-width="4"/>
        <rect x="86" y="172" width="1082" height="22" rx="8" fill="#edf4fb" opacity=".82"/>
        <line x1="86" y1="788" x2="1168" y2="788" stroke="#8193ab" stroke-opacity=".56" stroke-width="3"/>
        <path d="M814 152 V828" stroke="#6a7890" stroke-opacity=".72" stroke-width="5"/>
        <path d="M118 182 V798" stroke="#6c7990" stroke-opacity=".40" stroke-width="3"/>
        <path d="M1136 182 V798" stroke="#6c7990" stroke-opacity=".40" stroke-width="3"/>
      </g>

      <g id="fanSection">
        <circle cx="458" cy="490" r="272" fill="#d7e0eb" stroke="#8ea2ba" stroke-width="4"/>
        <circle cx="458" cy="490" r="248" fill="#07111b" stroke="#cad9e8" stroke-width="4"/>
        <circle id="fanGlowRing" cx="458" cy="490" r="244" fill="none" stroke="#2191ff" stroke-opacity="0.20" stroke-width="10" filter="url(#blueGlow)"/>
        <circle cx="458" cy="490" r="234" fill="url(#fanAura)"/>

        <g id="bladeRotor" class="ss-hp-still" style="animation:none;">
          <g class="bladeSet">
            <path d="M458 490 C470 454 520 394 586 346 C613 362 629 380 640 400 C610 438 548 474 458 490 Z" fill="url(#bladeGrad)"/>
            <path d="M472 482 C492 450 540 404 591 372" fill="none" stroke="#2191ff" stroke-opacity=".34" stroke-width="8" stroke-linecap="round"/>
          </g>
          <g class="bladeSet" transform="rotate(90 458 490)">
            <path d="M458 490 C470 454 520 394 586 346 C613 362 629 380 640 400 C610 438 548 474 458 490 Z" fill="url(#bladeGrad)"/>
            <path d="M472 482 C492 450 540 404 591 372" fill="none" stroke="#2191ff" stroke-opacity=".34" stroke-width="8" stroke-linecap="round"/>
          </g>
          <g class="bladeSet" transform="rotate(180 458 490)">
            <path d="M458 490 C470 454 520 394 586 346 C613 362 629 380 640 400 C610 438 548 474 458 490 Z" fill="url(#bladeGrad)"/>
            <path d="M472 482 C492 450 540 404 591 372" fill="none" stroke="#2191ff" stroke-opacity=".34" stroke-width="8" stroke-linecap="round"/>
          </g>
          <g class="bladeSet" transform="rotate(270 458 490)">
            <path d="M458 490 C470 454 520 394 586 346 C613 362 629 380 640 400 C610 438 548 474 458 490 Z" fill="url(#bladeGrad)"/>
            <path d="M472 482 C492 450 540 404 591 372" fill="none" stroke="#2191ff" stroke-opacity=".34" stroke-width="8" stroke-linecap="round"/>
          </g>
          <circle cx="458" cy="490" r="82" fill="url(#bodyGrad)" stroke="#eef6ff" stroke-width="4"/>
          <circle cx="458" cy="490" r="58" fill="url(#bodySideGrad)" opacity=".74"/>
        </g>

        <g id="fanGrille" stroke="#0c1622" stroke-width="5" fill="none" stroke-linecap="round">
          <circle cx="458" cy="490" r="236" stroke="#111e2d" stroke-width="8"/>
          <circle cx="458" cy="490" r="218" stroke="#36485e" stroke-width="2.4"/>
          <circle cx="458" cy="490" r="200" stroke="#36485e" stroke-width="2.4"/>
          <circle cx="458" cy="490" r="182" stroke="#36485e" stroke-width="2.4"/>
          <circle cx="458" cy="490" r="164" stroke="#36485e" stroke-width="2.4"/>
          <circle cx="458" cy="490" r="146" stroke="#36485e" stroke-width="2.4"/>
          <circle cx="458" cy="490" r="128" stroke="#36485e" stroke-width="2.4"/>
          <circle cx="458" cy="490" r="110" stroke="#36485e" stroke-width="2.4"/>
          <circle cx="458" cy="490" r="92" stroke="#36485e" stroke-width="2.4"/>
          <path d="M458 256 V724" stroke="#0f1e30" stroke-width="8"/>
          <path d="M224 490 H692" stroke="#0f1e30" stroke-width="8"/>
          <path d="M292 324 L624 656" stroke="#0f1e30" stroke-width="8"/>
          <path d="M624 324 L292 656" stroke="#0f1e30" stroke-width="8"/>
        </g>
      </g>

      <g id="displayBlock">
        <rect x="842" y="286" width="288" height="170" rx="18" fill="#d8e1ec" stroke="#6f8097" stroke-width="3"/>
        <rect x="858" y="302" width="256" height="138" rx="14" fill="url(#darkPanel)" stroke="#7ed0ff" stroke-opacity=".46" stroke-width="2.5"/>
        <path d="M866 310 H988 L956 432 H866 Z" fill="#ffffff" opacity=".09"/>
        <text x="884" y="334" font-size="14" fill="#7dbdff" font-family="monospace">POWER</text>
        <text id="powerValueDisplay" x="884" y="378" font-size="42" fill="#eaf8ff" font-family="monospace" font-weight="700">1.80 kW</text>
        <text x="884" y="404" font-size="13" fill="#7dbdff" font-family="monospace">FAN SPEED</text>
        <text id="fanSpeedDisplay" x="1090" y="404" font-size="13" fill="#cfefff" font-family="monospace" text-anchor="end">900 RPM</text>
        <rect x="884" y="414" width="206" height="12" rx="6" fill="#203244"/>
        <rect id="fanSpeedBar" x="884" y="414" width="103" height="12" rx="6" fill="#36a4ff"/>
        <rect x="884" y="414" width="206" height="12" rx="6" fill="none" stroke="#5caeff" stroke-opacity=".22" stroke-width="1.5"/>
      </g>

      <g id="ventSlots" fill="#0a1118" stroke="#7d8c9f" stroke-width="2.5">
        <rect x="884" y="552" width="228" height="32" rx="16"/>
        <rect x="884" y="620" width="228" height="32" rx="16"/>
        <rect x="884" y="688" width="228" height="32" rx="16"/>
      </g>
      <g id="ventMeshes" fill="#141f2c" opacity=".82">
        <rect x="896" y="560" width="204" height="16" rx="8"/>
        <rect x="896" y="628" width="204" height="16" rx="8"/>
        <rect x="896" y="696" width="204" height="16" rx="8"/>
      </g>

      <g id="screws">
        <circle cx="126" cy="806" r="10" fill="#39495f" stroke="#dce9f9" stroke-width="2.2"/>
        <circle cx="126" cy="806" r="4" fill="#08111a"/>
        <circle cx="850" cy="806" r="10" fill="#39495f" stroke="#dce9f9" stroke-width="2.2"/>
        <circle cx="850" cy="806" r="4" fill="#08111a"/>
        <circle cx="1124" cy="806" r="10" fill="#39495f" stroke="#dce9f9" stroke-width="2.2"/>
        <circle cx="1124" cy="806" r="4" fill="#08111a"/>
      </g>

      <g id="feet">
        <path d="M200 826 H320 L296 892 H176 Z" fill="url(#footGrad)" stroke="#bde0ff" stroke-width="3"/>
        <path d="M904 826 H1024 L1000 892 H880 Z" fill="url(#footGrad)" stroke="#bde0ff" stroke-width="3"/>
        <rect x="174" y="892" width="126" height="18" rx="6" fill="#2296ff" opacity=".82" filter="url(#softGlow)"/>
        <rect x="878" y="892" width="126" height="18" rx="6" fill="#2296ff" opacity=".82" filter="url(#softGlow)"/>
      </g>
</svg>
