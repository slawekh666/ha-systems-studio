        </g>
        <path d="M584 560 C578 606 566 642 546 674 C522 712 516 746 528 776 C544 816 578 838 620 834 C668 830 706 794 708 746 C710 706 690 674 658 634 C632 602 608 576 584 560 Z" fill="url(#flameOuter)" stroke="#88f5ff" stroke-width="4"/>
        <path d="M592 600 C590 632 580 658 564 684 C546 712 544 738 554 760 C566 788 590 802 620 800 C652 798 678 772 680 744 C682 716 668 692 646 664 C628 642 610 620 592 600 Z" fill="url(#flameInner)" opacity=".96"/>
        <path d="M586 658 C574 684 572 712 578 736 C586 716 598 694 614 678 C604 668 594 662 586 658 Z" fill="#ffffff" opacity=".72"/>
      </g>

      <g id="displayFrame">
