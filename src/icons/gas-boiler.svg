<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1350" aria-label="Gas boiler">
<defs>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f8fbff"/>
          <stop offset=".24" stop-color="#eef2f7"/>
          <stop offset=".58" stop-color="#d7dde7"/>
          <stop offset="1" stop-color="#c3cbd7"/>
        </linearGradient>
        <linearGradient id="bodySide" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#cdd5e0"/>
          <stop offset=".5" stop-color="#eef4fb"/>
          <stop offset="1" stop-color="#b6c0ce"/>
        </linearGradient>
        <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#2b3748"/>
          <stop offset=".3" stop-color="#7f92ab"/>
          <stop offset=".55" stop-color="#e4edf8"/>
          <stop offset="1" stop-color="#253344"/>
        </linearGradient>
        <linearGradient id="darkScreen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#07101b"/>
          <stop offset="1" stop-color="#02070f"/>
        </linearGradient>
        <linearGradient id="screenReflect" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".15"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="flameOuter" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#90f5ff"/>
          <stop offset=".45" stop-color="#19b8ff"/>
          <stop offset="1" stop-color="#0056ff"/>
        </linearGradient>
        <linearGradient id="flameInner" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e9ffff"/>
          <stop offset="1" stop-color="#3fd7ff"/>
        </linearGradient>
        <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
        <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
      </defs>

      <g id="aura">
