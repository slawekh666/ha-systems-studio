        <rect x="440" y="1052" width="268" height="90" rx="14" fill="url(#darkScreen)" stroke="#1eb5ff" stroke-opacity=".6" stroke-width="2.6"/>
        <path d="M448 1060 H570 L548 1140 H448 Z" fill="url(#screenReflect)"/>

        <line x1="528" y1="1062" x2="528" y2="1132" stroke="#13344e" stroke-opacity=".85" stroke-width="2"/>
        <line x1="620" y1="1062" x2="620" y2="1132" stroke="#13344e" stroke-opacity=".85" stroke-width="2"/>

        <g id="gasBarsGroup">
