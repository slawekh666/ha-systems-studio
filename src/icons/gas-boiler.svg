          <rect id="barLevel3" x="464" y="1086" width="50" height="10" rx="5" fill="#ff982a" opacity="0.16"/>
          <rect id="barLevel2" x="472" y="1104" width="42" height="10" rx="5" fill="#59d44e" opacity="1"/>
          <rect id="barLevel1" x="480" y="1122" width="34" height="10" rx="5" fill="#31a8ff" opacity="1"/>
        </g>

        <g id="displayFlameGroup" transform="translate(575 1132) scale(0.2857) translate(-596 -1154)" opacity="1">
          <g id="displayFlameGlow" opacity="0.27">
            <path d="M575 1122 C572 1110 572 1097 575 1082 C579 1062 587 1044 596 1028 C605 1044 613 1062 617 1082 C620 1097 620 1110 617 1122 C613 1138 605 1150 596 1154 C587 1150 579 1138 575 1122 Z" fill="#18a8ff" filter="url(#softGlow)"/>
          </g>
          <path id="displayFlameOuter" d="M575 1122 C572 1110 572 1097 575 1082 C579 1062 587 1044 596 1028 C605 1044 613 1062 617 1082 C620 1097 620 1110 617 1122 C613 1138 605 1150 596 1154 C587 1150 579 1138 575 1122 Z" fill="url(#flameOuter)"/>
          <path id="displayFlameInner" d="M581 1120 C579 1111 579 1100 581 1088 C584 1072 590 1058 596 1046 C602 1058 608 1072 611 1088 C613 1100 613 1111 611 1120 C608 1132 602 1141 596 1144 C590 1141 584 1132 581 1120 Z" fill="url(#flameInner)" opacity=".94"/>
          <path d="M588 1099 C588 1087 591 1076 596 1066 C594 1081 594 1093 595 1104 C592 1102 590 1100 588 1099 Z" fill="#ffffff" opacity=".62"/>
        </g>

        <g id="tempGroup">
          <text x="640" y="1080" font-size="11" fill="#76caff" font-family="monospace">TEMP</text>
          <text id="tempValueDisplay" x="640" y="1124" font-size="34" fill="#eff9ff" font-family="monospace" font-weight="700">65.0°</text>
          <text x="694" y="1122" font-size="16" fill="#7fd2ff" font-family="monospace">C</text>
        </g>
      </g>

      <g id="bottomConnectors">
        <g transform="translate(296 1214)">
          <rect x="0" y="0" width="64" height="74" rx="10" fill="url(#metalGrad)" stroke="#d4ebff" stroke-width="3"/>
          <rect x="8" y="60" width="48" height="12" rx="4" fill="#1fb4ff" opacity=".7" filter="url(#softGlow)"/>
        </g>
        <g transform="translate(680 1214)">
          <rect x="0" y="0" width="64" height="74" rx="10" fill="url(#metalGrad)" stroke="#d4ebff" stroke-width="3"/>
          <rect x="8" y="60" width="48" height="12" rx="4" fill="#1fb4ff" opacity=".7" filter="url(#softGlow)"/>
        </g>
      </g>
</svg>
