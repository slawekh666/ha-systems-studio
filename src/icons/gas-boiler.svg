        <path d="M180 154 Q180 106 228 106 H252 V1136 H228 Q180 1136 180 1088 Z" fill="#f0f5fa" opacity=".72"/>
        <path d="M884 106 H904 Q924 106 932 122 Q940 138 940 164 V1128 Q940 1182 894 1194 L884 1196 Z" fill="#bfc9d6" opacity=".72"/>
        <path d="M260 116 C352 108 680 104 848 120" fill="none" stroke="#ffffff" stroke-opacity=".42" stroke-width="6" stroke-linecap="round"/>
        <path d="M364 130 L620 858" stroke="#ffffff" stroke-opacity=".18" stroke-width="5"/>
        <line x1="164" y1="988" x2="940" y2="988" stroke="#8093ac" stroke-opacity=".5" stroke-width="4"/>
      </g>

      <g id="frontIcon" transform="translate(-60 0)" opacity="0.90">
