      </g>

      <g id="flueTop">
        <rect x="495" y="52" width="136" height="58" rx="18" fill="url(#metalGrad)" stroke="#d4ebff" stroke-width="4"/>
        <rect x="516" y="28" width="94" height="36" rx="12" fill="url(#metalGrad)" stroke="#d4ebff" stroke-width="3"/>
      </g>

      <g id="boilerBody">
